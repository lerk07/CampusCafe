<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="css/login.css" rel="stylesheet">
    <script src="js/login.js" defer></script>
</head>
<a></a>
<body>
    <img src="images/pngtree-3d-bakery-cafe-design-with-coffee-tables-picture-image_2690236.jpg">
    <main class="login-page">
        <section class="login-panel">
            <form class="login-form" id="loginForm">
                <h2>Welcome back</h2>
                <p>Sign in</p>

                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" type="email" value="admin" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" value="admin" minlength="6" required>
                </div>

                <button class="btn btn-primary" type="submit">Sign in</button>

                <div class="demo-note">
                    <strong>Demo login:</strong> Email: admin, Password: admin.
                </div>
            </form>
        </section>
    </main>
</body>

</html>
